name: One-time REVO history cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  rewrite:
    if: github.event.head_commit.message == 'Run REVO history cleanup'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Rewrite old product references in commit messages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --user git-filter-repo
          export PATH="$HOME/.local/bin:$PATH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git filter-repo --force --message-callback 'return message.replace(b"Klip", b"REVO").replace(b"KLIP", b"REVO").replace(b"klip", b"revo").replace(b"Andrewkernel", b"REVO Project").replace(b"andrewkernel", b"REVO Project")'
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git rm -f .github/workflows/revo-history-cleanup.yml || true
          git add -A
          git commit -m "Remove one-time REVO history cleanup workflow" || true
          git push --force origin HEAD:main
          git push --force origin --tags
